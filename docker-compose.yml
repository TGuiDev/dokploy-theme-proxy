services:
  dokploy-theme-proxy:
    image: nginx:1.27-alpine
    container_name: dokploy-theme-proxy
    restart: unless-stopped
    ports:
      - "${THEME_PORT:-3001}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./theme:/usr/share/theme:ro
