services:
  dokploy-theme-proxy:
    image: nginx:1.27-alpine
    container_name: dokploy-theme-proxy
    restart: unless-stopped
    ports:
      - "${THEME_PORT:-3001}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./theme:/usr/share/theme:ro
    depends_on:
      - dokploy-theme-stats

  dokploy-theme-stats:
    image: python:3.13-alpine
    container_name: dokploy-theme-stats
    restart: unless-stopped
    command: ["python", "-u", "/app/stats.py"]
    volumes:
      - ./stats/stats.py:/app/stats.py:ro
      - /proc:/host/proc:ro
      - /etc/hostname:/hostfs:ro   # só para medir o uso do disco do host
