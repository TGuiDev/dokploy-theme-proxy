map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Arquivos do tema (CSS/JS/logo) servidos direto pelo nginx
    location /__theme/ {
        alias /usr/share/theme/;
        add_header Cache-Control "no-cache";
    }

    # Ícone da marca Prakon (substitui o ícone do Dokploy)
    location = /icon.svg {
        alias /usr/share/theme/prakon.svg;
        add_header Cache-Control "no-cache";
    }

    # Métricas do servidor: só para quem está logado no Dokploy
    location = /__stats {
        auth_request /__auth;
        proxy_pass http://dokploy-theme-stats:8080/stats;
    }

    location = /__auth {
        internal;
        proxy_pass http://dokploy_upstream/api/trpc/user.get?batch=1&input=%7B%220%22%3A%7B%22json%22%3Anull%7D%7D;
        proxy_http_version 1.1;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Accept-Encoding "";
    }

    # Todo o resto vai para o Dokploy
    location / {
        proxy_pass http://dokploy_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (terminal, logs em tempo real)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # sub_filter precisa do HTML sem compressão
        proxy_set_header Accept-Encoding "";

        sub_filter_once on;
        sub_filter '<title>Dokploy</title>' '<title>Prakon</title>';
        sub_filter '</head>' '<link rel="stylesheet" href="/__theme/custom.css"><script defer src="/__theme/custom.js"></script><script defer src="/__theme/prakon.js"></script></head>';
    }
}

upstream dokploy_upstream {
    server host.docker.internal:3000;
}
